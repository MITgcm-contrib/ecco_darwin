# exch2 added 2026-09-30 with the stereographic retarget. The disc is
# inscribed in a 1680x1680 square, so 371 of the 784 60x60 tiles are entirely
# outside the circle and are blanked (data.exch2 blankList). Without exch2
# there is no way to skip them and the run would carry 47% dead tiles.
