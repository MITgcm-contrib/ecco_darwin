radtrans
# radtrans needs a SOURCE of spectral surface irradiance; it does not compute
# one. pkg/oasim supplies Ed/Es per waveband from atmospheric state, and
# pkg/sun supplies the solar geometry oasim and radtrans both need. Without
# them radtrans has no irradiance at all. Added 2026-09-30 to match
# ecco_darwin v06/1deg code_darwin_v4r5_v2_AO/packages.conf, which lists
# radtrans, sun and oasim together.
#
# NOTE: the shared /nobackup/dcarrol2/v05_V5r1/darwin3 tree has pkg/sun and
# pkg/radtrans but NO pkg/oasim. This is only possible because pan_AO builds
# against its own darwin3_ckpt69k, which has all three.
sun
oasim
